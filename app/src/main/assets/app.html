<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07091a">
<title>은퇴 투자 시뮬레이터</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#07091a;--bg2:#0e1425;--bg3:#141d2e;--bd:#1e2e47;
  --tx:#e8eef7;--mu:#7a8ba8;--ac:#4f7cff;--gn:#4de89a;
  --ye:#ffd060;--rd:#ff6b7d;--tl:#2dd4bf;--pu:#a78bfa
}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
.app{max-width:800px;margin:0 auto;padding-bottom:76px}
/* 헤더 */
.hdr{padding:13px 14px 9px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{color:var(--mu);font-size:10px;margin-top:2px}
/* 탭 네비게이션 */
.nav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex-shrink:0;padding:10px 9px;background:none;border-bottom:2px solid transparent;color:var(--mu);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;transition:color .15s,border-color .15s}
.nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
/* 페이지 */
.pg{padding:10px 12px}
/* 카드 */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.ct{font-weight:700;font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
/* 그리드 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
/* 필드 */
.fld{margin-bottom:8px}
.fld label{display:block;color:var(--mu);font-size:11px;margin-bottom:4px}
.fld input,.fld select{width:100%;background:#060d1b;border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:10px;font-size:15px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--ac)}
/* KPI */
.kw{text-align:center;padding:6px 2px}
.kl{color:var(--mu);font-size:11px;margin-bottom:3px}
.kv{font-size:20px;font-weight:800;line-height:1.15;word-break:break-all}
.ks{color:var(--mu);font-size:11px;margin-top:2px}
/* 버튼 */
.btn{padding:10px 14px;background:var(--bg3);border:1px solid var(--bd);border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.bp{background:var(--ac);border-color:var(--ac);color:#fff}
.bd2{background:#3a0e16;border-color:var(--rd);color:var(--rd)}
.bsm{padding:7px 11px;font-size:12px;border-radius:8px}
.btl{background:#0d2e2a;border-color:var(--tl);color:var(--tl)}
.bye{background:#2a1e00;border-color:var(--ye);color:var(--ye)}
/* 종목 아이템 */
.si{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:7px 0;background:var(--bg3)}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.sn{font-weight:700;font-size:15px}
.sm{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
/* 배지/필 */
.pl{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.plg{border-color:var(--gn);color:var(--gn)}
.ply{border-color:var(--ye);color:var(--ye)}
.plr{border-color:var(--rd);color:var(--rd)}
.pla{border-color:var(--ac);color:var(--ac)}
.pltl{border-color:var(--tl);color:var(--tl)}
/* 테이블 */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:2px}
.tbl th{color:var(--mu);font-weight:600;font-size:11px;background:var(--bg)}
.tbl tr:last-child td{border-bottom:none}
/* 바 */
.bar-bg{height:6px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:6px;transition:width .3s}
/* 유틸 */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bw{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gn{color:var(--gn)}.ye{color:var(--ye)}.rd{color:var(--rd)}.mu{color:var(--mu)}.tl{color:var(--tl)}.ac{color:var(--ac)}.pu{color:var(--pu)}
.nt{font-size:12px;color:var(--mu);line-height:1.6;padding:5px 0}
.hr{height:1px;background:var(--bd);margin:12px 0}
/* 토스트 */
#toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#1e2e47;border:1px solid var(--bd);padding:10px 18px;border-radius:12px;z-index:200;display:none;font-size:14px;max-width:92%;text-align:center;pointer-events:none}
/* 로딩 */
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 검색 결과 */
.sr{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--bg3)}
.sr:active{opacity:.7}
/* SVG 차트 */
.chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 스크롤 가능한 테이블 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 배당 상태 배지 */
.bdg{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700}
.blv{background:#0a2a0f;color:var(--gn);border:1px solid #1a5a2f}
.bca{background:#2a2500;color:var(--ye);border:1px solid #5a4a00}
.bfl{background:#2a0a0f;color:var(--rd);border:1px solid #5a1a2f}
.bmn{background:var(--bg3);color:var(--mu);border:1px solid var(--bd)}
/* 체크박스 행 */
.sw-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.sw-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
/* 반응형 */
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}.kv{font-size:17px}}
@media(max-width:360px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.kv{font-size:15px}}
</style>

<body>
<div class="app">
  <div class="hdr">
    <div>
      <h1>🏖 은퇴 투자 시뮬레이터</h1>
      <div class="sub">증권사 로그인 없음 · 로컬 저장 · v6.0</div>
    </div>
    <button class="btn bsm" onclick="saveAll()">💾 저장</button>
  </div>

  <main id="main"></main>

<div id="toast"></div>
<script>
'use strict';
// ═══════════════════════════════════════════
// § 1. 안전한 수학 (NaN/Infinity 화면 노출 금지)
// ═══════════════════════════════════════════
const safe=(v,d=0)=>(v===null||v===undefined||!isFinite(v)||isNaN(v))?d:+v;
const sdiv=(a,b,d=0)=>b===0||!isFinite(b)?d:safe(a/b,d);
const spow=(b,e)=>{if(e>500)return Number.MAX_SAFE_INTEGER;const r=Math.pow(safe(b),safe(e));return safe(r,0);};
const sabs=v=>Math.abs(safe(v,0));
const smax=(...a)=>Math.max(...a.map(x=>safe(x,-Infinity)));
const smin=(...a)=>Math.min(...a.map(x=>safe(x,Infinity)));
// 포맷터 (NaN 완전 방어)
const fA=v=>{const n=safe(v,0);if(sabs(n)>=1e8)return(n/1e8).toFixed(1)+'억';if(sabs(n)>=1e4)return(n/1e4).toFixed(0)+'만';return n.toFixed(0);};
const fW=v=>safe(v,0)===0?'0원':new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(safe(v,0))+'원';
const fP=(v,d=1)=>{const n=safe(v,0);return n.toFixed(d)+'%';};
const fN=v=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:2}).format(safe(v,0));
const fD=v=>v?new Date(v).toLocaleDateString('ko-KR'):'확인되지 않음';

  ['015760','KEPCO','한국전력','유틸리티','KR','KRW',false],

function searchLocal(q){
  if(!q||q.trim().length<1)return [];
  const t=q.trim().toLowerCase();
  return STKDB.filter(s=>
    s[0].toLowerCase().includes(t)||
    s[1].toLowerCase().includes(t)||
    s[2].toLowerCase().includes(t)||
    s[3].toLowerCase().includes(t)
  ).slice(0,12);
}

// ═══════════════════════════════════════════
// § 3. 데이터 저장/로드
// ═══════════════════════════════════════════
const SKEY='retireSim_v9';
const DEF_S={
  _v:9,portfolio:[],phases:[],annualData:{},
  seed:11000,monthly:275,annualRaise:10,bonus:150,bonusFrom:2028,
  startYear:2027,retireYear:2045,endYear:9999,
  target:0,inflation:2.5,monthlyLiving:400,
  salary:0,healthType:'직장',applyTax:true,taxRate:22,
  fxUSD:1350,fxUpdated:null,fxSource:'기본값',
  mcRuns:1000,mcVol:15,withdrawRate:4,pension:0,
  rebalThresh:5,
  actualAsset:0,priceCache:{},
  crashYear:2030,crashPct:30,crashRecovery:3,
  showReal:true,
};
let S={...DEF_S};

function loadAll(){
  try{
    const r=localStorage.getItem(SKEY);
    if(!r)return;
    const d=JSON.parse(r);
    S={...DEF_S,...d};
    if(!Array.isArray(S.portfolio))S.portfolio=[];
    if(!S.annualData||typeof S.annualData!=='object')S.annualData={};
    if(!S.priceCache||typeof S.priceCache!=='object')S.priceCache={};
    if(!Array.isArray(S.phases))S.phases=[];
  }catch(e){
    S={...DEF_S};
    toast('⚠️ 데이터 로드 오류 — 기본값으로 시작합니다');
  }
}

function saveAll(){
  try{
    S._v=9;S._saved=new Date().toISOString();
    localStorage.setItem(SKEY,JSON.stringify(S));
    toast('💾 저장됐습니다');
  }catch(e){toast('❌ 저장 실패: '+e.message);}
}

function toast(msg,dur=2200){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>{t.style.display='none';},dur);
}

// ═══════════════════════════════════════════
// § 4. API 레이어 (CORS 프록시 폴백)
// ═══════════════════════════════════════════
const PROXIES=[
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

async function fetchSafe(url,timeout=7000){
  // 직접 시도
  try{
    const c=new AbortController();
    const t=setTimeout(()=>c.abort(),timeout);
    const r=await fetch(url,{signal:c.signal});
    clearTimeout(t);
    if(r.ok){const d=await r.json();return{ok:true,data:d,src:'직접'};}
  }catch(e){}
  // 프록시 순차 시도
  for(const mkP of PROXIES){
    try{
      const pu=mkP(url);
      const c=new AbortController();
      const t=setTimeout(()=>c.abort(),7000);
      const r=await fetch(pu,{signal:c.signal});
      clearTimeout(t);
      if(!r.ok)continue;
      const raw=await r.json();
      const d=raw.contents?JSON.parse(raw.contents):raw;
      return{ok:true,data:d,src:'CORS프록시'};
    }catch(e){}
  }
  return{ok:false,error:'네트워크 오류 — 모든 연결 실패'};
}

// 종목 검색 (Yahoo Finance)
async function searchStocksAPI(q){
  const url=`https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=10&newsCount=0`;
  const res=await fetchSafe(url);
  if(!res.ok)return{ok:false,quotes:[],err:res.error};
  const quotes=(res.data?.quotes||[]).filter(x=>x.symbol&&['EQUITY','ETF','MUTUALFUND'].includes(x.quoteType));
  return{ok:true,quotes,src:res.src,at:new Date().toLocaleTimeString('ko-KR')};
}

// 현재가 조회
async function fetchPrice(ticker){
  // 캐시 확인 (5분)
  const cached=S.priceCache[ticker];
  if(cached&&Date.now()-safe(cached.t)<5*60*1000)
    return{...cached,sts:'cache',src:'캐시(5분 이내)'};
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
  const res=await fetchSafe(url);
  if(!res.ok){
    if(cached)return{...cached,sts:'cache',src:'캐시(오류 시 사용)'};
    return{price:null,cur:'USD',sts:'fail',err:'가격 조회 실패'};
  }
  const m=res.data?.chart?.result?.[0]?.meta;
  const price=safe(m?.regularMarketPrice);
  const cur=m?.currency||'USD';
  const obj={price,cur,t:Date.now(),at:new Date().toLocaleString('ko-KR'),src:res.src,sts:'live'};
  if(price>0)S.priceCache[ticker]=obj;
  return obj;
}

// 환율 조회
async function fetchFX(){
  try{
    const url='https://api.frankfurter.app/latest?from=USD&to=KRW';
    const c=new AbortController();
    const t=setTimeout(()=>c.abort(),6000);
    const r=await fetch(url,{signal:c.signal});
    clearTimeout(t);
    if(!r.ok)throw new Error('fail');
    const d=await r.json();
    const rate=safe(d?.rates?.KRW,1350);
    S.fxUSD=rate;S.fxUpdated=new Date().toLocaleString('ko-KR');S.fxSource='Frankfurter API(실시간)';
    return{rate,src:'Frankfurter API',sts:'live',date:d.date};
  }catch(e){
    return{rate:safe(S.fxUSD,1350),src:'캐시(마지막정상값)',sts:'cache'};
  }
}

// 배당 정보 조회
async function fetchDiv(ticker){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1y&events=dividends`;
  const res=await fetchSafe(url);
  if(!res.ok)return{yld:null,lastDiv:null,sts:'fail',err:'배당 데이터 없음'};
  const m=res.data?.chart?.result?.[0]?.meta;
  const yld=safe(m?.trailingAnnualDividendYield)*100;
  const lastDiv=safe(m?.trailingAnnualDividendRate);
  return{yld,lastDiv,cur:m?.currency||'USD',sts:'live',src:res.src,at:new Date().toLocaleString('ko-KR')};
}

// ═══════════════════════════════════════════
// § 5. 한국 세금/건보료 계산 (2024년 기준)
// ═══════════════════════════════════════════
const TAX_BR=[
  {l:14e6,r:.06,d:0},{l:50e6,r:.15,d:1.26e6},
  {l:88e6,r:.24,d:5.76e6},{l:150e6,r:.35,d:15.44e6},
  {l:300e6,r:.38,d:19.94e6},{l:500e6,r:.40,d:25.94e6},
  {l:1e9,r:.42,d:35.94e6},{l:Infinity,r:.45,d:65.94e6},
];

function calcTax({divAnnual=0,gain=0,salary=0,healthType='직장'}){
  const d=safe(divAnnual),g=safe(gain),s=safe(salary);
  const WHOLD=0.154,COMP=20e6,HT=healthType==='직장'?20e6:10e6,HR=0.0709,LT=0.1295;
  // 양도소득세 (해외주식 22%, 250만원 공제)
  const gainTax=Math.max(0,safe((g-2.5e6)*0.22));
  // 배당 원천징수
  const withheld=safe(d*WHOLD);
  // 종합소득세 추가 (2,000만원 초과)
  let addTax=0,margRate=0;
  if(d>COMP){
    const tax=d-COMP+s;
    for(const b of TAX_BR){
      if(tax<=b.l){
        addTax=Math.max(0,safe(tax*b.r-b.d-s*b.r));
        margRate=b.r*100;break;
      }
    }
  }
  // 건보료
  let hPrem=0,ltPrem=0;
  if(d>HT){hPrem=safe((d-HT)*HR);ltPrem=safe(hPrem*LT);}
  const total=safe(gainTax+withheld+addTax+hPrem+ltPrem);
  return{
    gainTax:Math.round(gainTax),withheld:Math.round(withheld),
    addTax:Math.round(safe(addTax)),hPrem:Math.round(safe(hPrem)),
    ltPrem:Math.round(safe(ltPrem)),total:Math.round(total),
    netDiv:Math.round(Math.max(0,d-withheld-addTax-hPrem-ltPrem)),
    margRate,year:2024,src:'국민건강보험공단·국세청 2024년 기준(추정치)',
  };
}

// ═══════════════════════════════════════════
// § 6. 시뮬레이션 엔진
// ═══════════════════════════════════════════
function getBlendedReturn(yr){
  // Phase 전략 우선
  if(S.phases&&S.phases.length){
    const ph=S.phases.find(p=>yr>=p.from&&yr<=p.to);
    if(ph&&ph.rate!=null)return safe(ph.rate);
  }
  // 포트폴리오 가중평균
  const pf=S.portfolio||[];
  if(!pf.length)return 10;
  const tw=safe(pf.reduce((s,a)=>s+safe(a.weight),0),100)||100;
  return safe(pf.reduce((s,a)=>s+safe(a.weight/tw)*safe(a.expected,10),0));
}

function getDivAnnual(){
  const pf=S.portfolio||[];
  const fx=safe(S.fxUSD,1350);
  return safe(pf.reduce((s,a)=>{
    const v=safe(a.qty)*safe(a.price||0)*(a.cur==='KRW'?1:fx);
    return s+v*safe(a.divYield)/100;
  },0));
}

function simulate(){
  const sy=safe(S.startYear,2027);
  const ey=Math.min(safe(S.endYear,9999),sy+300); // 최대 300년 (9999 처리)
  if(sy>=ey)return[];
  const rows=[];
  let asset=safe(S.seed)*10000;
  let mon=safe(S.monthly)*10000;
  let totalIn=asset;

  for(let yr=sy;yr<=ey;yr++){
    const mc=safe(mon);
    const bY=yr>=safe(S.bonusFrom)?safe(S.bonus)*10000:0;
    totalIn=safe(totalIn+mc*12+bY);

    // 실제 수익률 우선 사용
    const ad=S.annualData[yr]||{};
    let r=ad.actual!=null?safe(ad.actual):safe(getBlendedReturn(yr));
    r=Math.max(-99.9,r); // -100% 이하 클램프 (자산 소멸 방지)
    r=Math.min(r,10000); // 10000% 이상 클램프

    asset=Math.max(0,safe(asset*(1+r/100)+mc*12+bY));

    // 세금
    const gain=Math.max(0,asset-totalIn);
    const gainTax=S.applyTax?Math.max(0,safe((gain-2.5e6)*safe(S.taxRate)/100)):0;
    const afterTax=Math.max(0,safe(asset-gainTax));

    // 물가 반영 실질자산
    const infl=spow(1+safe(S.inflation)/100,yr-sy);
    const realAsset=Math.max(0,safe(sdiv(afterTax,infl)));

    // 배당
    const divAnnual=getDivAnnual();
    const divMon=safe(divAnnual/12);

    // 생활비
    const needLiving=safe(safe(S.monthlyLiving)*10000*infl);
    const neededAsset=safe(needLiving*12/0.04);
    const coverPct=safe(sdiv(divMon,needLiving)*100);

    // 세금 상세
    const tx=calcTax({divAnnual,gain,salary:safe(S.salary)*10000,healthType:S.healthType});

    rows.push({
      year:yr,asset:Math.round(asset),afterTax:Math.round(afterTax),
      realAsset:Math.round(realAsset),divMon:Math.round(divMon),
      divAnnual:Math.round(divAnnual),mc:Math.round(mc),
      livingNeed:Math.round(needLiving),neededAsset:Math.round(neededAsset),
      coverPct:safe(coverPct),totalIn:Math.round(totalIn),
      gainTax:Math.round(gainTax),tx,
      r,expected:safe(ad.expected,getBlendedReturn(yr)),actual:ad.actual,
    });

    // 다음 연도 월 납입액 (고정 증액)
    mon=safe(mon+safe(S.annualRaise)*10000);
  }
  return rows;
}

// ═══════════════════════════════════════════
// § 7. 몬테카를로 시뮬레이션 (비동기 청크)
// ═══════════════════════════════════════════
let _mcRunning=false,_mcResult=null;

function runMC(onProgress,onDone){
  if(_mcRunning)return;
  _mcRunning=true;
  const sy=safe(S.startYear,2027);
  const ey=Math.min(safe(S.retireYear,2045),sy+100);
  const runs=Math.min(10000,Math.max(100,safe(S.mcRuns,1000)));
  const vol=safe(S.mcVol,15);
  const baseR=getBlendedReturn(sy);
  const results=[];
  const CHUNK=200;
  let i=0;

  function step(){
    const end=Math.min(i+CHUNK,runs);
    for(;i<end;i++){
      let bal=safe(S.seed)*10000;
      let mon=safe(S.monthly)*10000;
      for(let yr=sy;yr<=ey;yr++){
        const u1=Math.random()||1e-10,u2=Math.random();
        const z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
        let r=baseR+z*vol;
        r=Math.max(-99.9,Math.min(r,1000));
        const bY=yr>=safe(S.bonusFrom)?safe(S.bonus)*10000:0;
        bal=Math.max(0,safe(bal*(1+r/100)+mon*12+bY));
        mon=safe(mon+safe(S.annualRaise)*10000);
      }
      results.push(safe(bal));
    }
    onProgress&&onProgress(Math.round(i/runs*100));
    if(i<runs){setTimeout(step,0);}
    else{
      results.sort((a,b)=>a-b);
      const pc=p=>safe(results[Math.floor((runs-1)*p)],0);
      const tgt=safe(S.target)*10000;
      const prob=tgt>0?sdiv(results.filter(x=>x>=tgt).length,runs)*100:0;
      _mcRunning=false;
      _mcResult={
        p10:pc(.1),p25:pc(.25),p50:pc(.5),p75:pc(.75),p90:pc(.9),
        mean:safe(results.reduce((s,v)=>s+v,0)/runs),
        prob:safe(prob),runs,all:results,
      };
      onDone&&onDone(_mcResult);
    }
  }
  step();
}

// ═══════════════════════════════════════════
// § 8. 목표 역산
// ═══════════════════════════════════════════
function revReturn(tgtMan){
  // 필요 수익률 이진탐색
  const tgt=safe(tgtMan)*10000;
  if(tgt<=0)return 0;
  let lo=-50,hi=500,mid=0;
  for(let i=0;i<80;i++){
    mid=(lo+hi)/2;
    // 단순 복리 추정
    const yrs=Math.max(1,safe(S.retireYear,2045)-safe(S.startYear,2027));
    const seed=safe(S.seed)*10000;
    const mon=safe(S.monthly)*10000;
    // 연납입 총액 추정
    const annualContrib=mon*12+safe(S.bonus)*10000;
    // FV = seed*(1+r)^n + PMT*((1+r)^n-1)/r
    const r=mid/100;
    const growth=spow(1+r,yrs);
    const fv=safe(seed*growth+(r>0.001?annualContrib*(growth-1)/r:annualContrib*yrs));
    if(fv<tgt)lo=mid;else hi=mid;
  }
  return safe(mid,0);
}

function revMonthly(tgtMan,rate){
  const tgt=safe(tgtMan)*10000;
  const r=safe(rate)/100;
  const yrs=Math.max(1,safe(S.retireYear,2045)-safe(S.startYear,2027));
  const seed=safe(S.seed)*10000;
  const growth=spow(1+r,yrs);
  const seedFV=seed*growth;
  if(seedFV>=tgt)return 0;
  const rem=tgt-seedFV;
  const af=r>0.001?(growth-1)/r:yrs;
  return safe(sdiv(rem,af)/12/10000,0); // 만원/월
}

// ═══════════════════════════════════════════
// § 9. 은퇴 후 인출 시뮬
// ═══════════════════════════════════════════
function withdrawal(startBal,monWD,blendedR,years){
  let bal=safe(startBal);
  const rows=[{yr:0,bal}];
  for(let y=1;y<=Math.min(safe(years),100)&&bal>0;y++){
    bal=safe(bal*(1+safe(blendedR)));
    const infl=spow(1+safe(S.inflation)/100,y);
    const wd=safe(monWD)*12*infl;
    const pen=safe(S.pension)*10000*12;
    bal=Math.max(0,safe(bal-Math.max(0,wd-pen)));
    rows.push({yr:y,bal:Math.round(bal)});
  }
  return rows;
}

// ═══════════════════════════════════════════
// § 10. 폭락 시나리오
// ═══════════════════════════════════════════
function crashSim(rows){
  if(!rows||!rows.length)return rows;
  const cy=safe(S.crashYear,2030);
  const cp=safe(S.crashPct,30)/100;
  const cr=Math.max(1,safe(S.crashRecovery,3));
  return rows.map(r=>{
    if(r.year<cy)return{...r,_crashed:false};
    if(r.year===cy)return{...r,afterTax:Math.round(safe(r.afterTax*(1-cp))),_crashed:true,_crashYr:true};
    const ya=r.year-cy;
    const rec=Math.min(1,ya/cr);
    return{...r,afterTax:Math.round(safe(r.afterTax*(1-cp*(1-rec)))),_crashed:true};
  });
}

// ═══════════════════════════════════════════
// § 11. SVG 라인 차트
// ═══════════════════════════════════════════
function svgChart(rows,series,w=640,h=220){
  if(!rows||rows.length<2)return '<div class="nt">데이터 부족</div>';
  const pad={t:20,r:12,b:28,l:52};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const xs=rows.map(r=>r.year);
  const allY=series.flatMap(s=>rows.map(r=>safe(r[s.key],0)));
  const mn=0,mx=smax(...allY)||1;
  const px=x=>pad.l+sdiv((x-xs[0]),(xs[xs.length-1]-xs[0]||1))*iw;
  const py=y=>pad.t+ih-sdiv(safe(y,0)-mn,mx-mn||1)*ih;
  // 그리드
  const steps=[0,.25,.5,.75,1];
  const grid=steps.map(s=>{
    const v=mn+(mx-mn)*s;
    const yp=pad.t+ih*(1-s);
    return `<line x1="${pad.l}" y1="${yp.toFixed(1)}" x2="${pad.l+iw}" y2="${yp.toFixed(1)}" stroke="#1e2e47" stroke-width=".7"/>
<text x="${(pad.l-4).toFixed(0)}" y="${(yp+4).toFixed(0)}" text-anchor="end" fill="#7a8ba8" font-size="10">${fA(v)}</text>`;
  }).join('');
  // X축 레이블
  const step=Math.max(1,Math.floor(rows.length/5));
  const xlbl=rows.filter((_,i)=>i%step===0||i===rows.length-1).map(r=>
    `<text x="${px(r.year).toFixed(0)}" y="${h-4}" text-anchor="middle" fill="#7a8ba8" font-size="10">${r.year}</text>`
  ).join('');
  // 라인
  const lines=series.map(s=>{
    const pts=rows.map(r=>`${px(r.year).toFixed(1)},${py(safe(r[s.key],0)).toFixed(1)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join('');
  // 범례
  const leg=series.map((s,i)=>
    `<circle cx="${12+i*100}" cy="12" r="5" fill="${s.c}"/>
<text x="${20+i*100}" y="16" fill="${s.c}" font-size="11">${s.label}</text>`
  ).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;min-width:280px;display:block">
${grid}${xlbl}${lines}
<g transform="translate(${pad.l},1)">${leg}</g>
</svg>`;
}

function startMC(){
  const btn=document.getElementById('mcbtn');
  if(btn)btn.disabled=true;
  document.getElementById('mcprog').innerHTML='<div class="nt"><span class="spin"></span>계산 중... 0%</div>';
  runMC(
    pct=>{const el=document.getElementById('mcprog');if(el)el.innerHTML=`<div class="nt"><span class="spin"></span>계산 중... ${pct}%</div>`;},
    result=>{
      render();
      setTimeout(()=>{
        const cv=document.getElementById('mchist');if(!cv)return;
        const ctx=cv.getContext('2d');
        const{all,p10,p90}=result;
        const mn=all[0]||0,mx=all[all.length-1]||1;
        const bins=24,bw=Math.max(1,(mx-mn)/bins);
        const counts=new Array(bins).fill(0);
        all.forEach(v=>{const b=Math.min(bins-1,Math.floor((v-mn)/bw));counts[b]++;});
        const maxC=Math.max(...counts)||1;
        const W=cv.width,H=cv.height;
        const bwPx=(W-8)/bins;
        ctx.clearRect(0,0,W,H);
        const tgt=safe(S.target)*10000;
        counts.forEach((c,i)=>{
          const x=4+i*bwPx;
          const h2=Math.round((c/maxC)*(H-6));
          const val=mn+bw*i;
          ctx.fillStyle=val>=tgt?'#4de89a':'#4f7cff';
          ctx.fillRect(x,H-h2,bwPx-1,h2);
        });
      },80);
    }
  );
}

// ──── 탭⑦: 리밸런싱+목표역산 ────
function tabRebal(){
  const pf=S.portfolio||[];
  const fx=safe(S.fxUSD,1350);
  const total=pf.reduce((s,a)=>s+safe(a.qty)*safe(a.price||0)*(a.cur==='KRW'?1:fx),0);
  return `<div class="pg">
<div class="card">
  <div class="ct bw">🔄 리밸런싱 분석 <span class="pl">트리거 ±${safe(S.rebalThresh)}%</span></div>
  <div class="fld"><label>트리거 임계값%</label><input type="number" value="${S.rebalThresh}" step="1" onchange="S.rebalThresh=+this.value;saveAll();render()" min="1" max="30"></div>
  ${total>0?`<div class="tbl-wrap"><table class="tbl">
    <tr><th>종목</th><th>목표%</th><th>현재%</th><th>편차</th><th>평가금</th><th>액션</th></tr>
    ${pf.map(s=>{
      const val=safe(s.qty)*safe(s.price||0)*(s.cur==='KRW'?1:fx);
      const cur=sdiv(val,total)*100;
      const tgt=safe(s.weight);
      const drift=cur-tgt;
      const need=Math.abs(drift)>safe(S.rebalThresh);
      return `<tr>
        <td>${s.ticker}</td>
        <td>${fP(tgt,0)}</td>
        <td>${fP(cur,1)}</td>
        <td class="${Math.abs(drift)>5?'rd':Math.abs(drift)>2?'ye':'gn'}">${drift>=0?'+':''}${fP(drift,1)}</td>
        <td>${fA(val)}</td>
        <td>${need?`<span class="${drift>0?'rd':'gn'}">${drift>0?'▼ 매도':'▲ 매수'}</span>`:'<span class="mu">유지</span>'}</td>
      </tr>`;
    }).join('')}
  </table></div>
  ${(()=>{
    const needs=pf.filter(s=>{
      const val=safe(s.qty)*safe(s.price||0)*(s.cur==='KRW'?1:fx);
      return Math.abs(sdiv(val,total)*100-safe(s.weight))>safe(S.rebalThresh);
    });
    return needs.length?`<div class="nt" style="color:var(--ye);margin-top:8px">⚡ 리밸런싱 필요: ${needs.map(s=>s.ticker).join(', ')}</div>`
      :'<div class="nt gn" style="margin-top:8px">✅ 모든 종목이 목표 범위 내입니다.</div>';
  })()}`:'<div class="nt">종목에 수량과 현재가를 입력하면 분석이 표시됩니다.</div>'}
</div>
<div class="card">
  <div class="ct">🎯 목표 역산</div>
  <div class="g2">
    <div class="fld"><label>목표 자산(억원)</label><input type="number" id="rtgt" value="${safe(S.target)/10000}" step="0.1" min="0"></div>
    <div class="fld"><label>기준 수익률%</label><input type="number" id="rrate" value="${fP(getBlendedReturn(safe(S.startYear,2027)),1).replace('%','')}" step="0.1"></div>
  </div>
  <button class="btn bp bsm" onclick="doReverse()">역산 계산</button>
  <div id="revres" style="margin-top:10px"></div>
</div>
</div>`;
}

function doReverse(){
  const tgtAeok=safe(parseFloat(document.getElementById('rtgt').value),0);
  const tgtMan=tgtAeok*10000; // 억→만원
  const rate=safe(parseFloat(document.getElementById('rrate').value),10);
  const needR=revReturn(tgtMan);
  const needM=revMonthly(tgtMan,rate);
  document.getElementById('revres').innerHTML=`<div class="g2">
    <div class="kw"><div class="kl">필요 연 수익률</div><div class="kv ye">${fP(needR,1)}</div><div class="ks">월납입 고정 시</div></div>
    <div class="kw"><div class="kl">필요 월 납입액</div><div class="kv tl">${fA(needM*10000)}</div><div class="ks">수익률 ${fP(rate)} 고정 시</div></div>
  </div><div class="nt">단순 복리 추정. 실제와 차이가 있을 수 있습니다.</div>`;
}

async function doFetchFX(){
  toast('📡 환율 조회 중...');
  const res=await fetchFX();
  render();toast(`✅ USD/KRW: ${res.rate.toFixed(0)}원 (${res.src})`);

function exportJSON(){
  const j=JSON.stringify(S,null,2);
  const b=new Blob([j],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='은퇴투자_백업_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
  toast('✅ 백업 파일을 저장했습니다');
}

function importJSON(el){
  const f=el.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw new Error('형식 오류');
      S={...DEF_S,...d};
      if(!Array.isArray(S.portfolio))S.portfolio=[];
      if(!S.annualData)S.annualData={};
      saveAll();render();toast('✅ 백업을 복원했습니다');
    }catch(e){toast('❌ 백업 파일 오류: '+e.message);}
  };
  r.readAsText(f);
}

function exportCSV(){
  const rows=simulate();
  const hdr='연도,세후자산(원),실질자산(원),월배당(원),생활비(원),배당커버율%,수익률%,총납입(원)';
  const body=rows.map(r=>`${r.year},${r.afterTax},${r.realAsset},${r.divMon},${r.livingNeed},${r.coverPct.toFixed(1)},${r.r.toFixed(1)},${r.totalIn}`).join('\n');
  const b=new Blob(['\ufeff'+hdr+'\n'+body],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='은퇴투자_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();URL.revokeObjectURL(a.href);
  toast('✅ CSV를 저장했습니다');
}

// ═══════════════════════════════════════════
const TABS=[
  ['home','🏠 홈'],['port','📊 포트폴리오'],['div','💰 배당'],
  ['annual','📅 연도별'],['mc','🎲 MC'],['wd','💸 은퇴인출'],
  ['rebal','🔄 리밸'],['tax','🧾 세금'],['set','⚙️ 설정'],
];
const TAB_FNS={home:tabHome,port:tabPort,div:tabDiv,annual:tabAnnual,mc:tabMC,wd:tabWD,rebal:tabRebal,tax:tabTax,set:tabSet};
let _curTab='home';

function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(([id,l])=>
    `<button class="${_curTab===id?'on':''}" onclick="switchTab('${id}')">${l}</button>`
  ).join('');
}

function switchTab(id){_curTab=id;render();}

function render(){
  renderNav();
  try{
    const fn=TAB_FNS[_curTab];
    document.getElementById('main').innerHTML=fn?fn():'';
  }catch(e){
    console.error('render error:',e);
    document.getElementById('main').innerHTML=`<div class="pg"><div class="card">
      <div class="ct">⚠️ 오류가 발생했습니다</div>
      <div class="nt">${e.message||String(e)}</div>
      <button class="btn bp bsm" style="margin-top:10px" onclick="render()">🔄 다시 시도</button>
    </div></div>`;
  }
}
