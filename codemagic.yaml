workflows:
  android-workflow:
    name: 은퇴투자 시뮬레이터 APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: 📥 Gradle Wrapper 다운로드
        script: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - name: 🏗️ APK 빌드
        script: ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - user@example.com
