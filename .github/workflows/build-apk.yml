name: EAS Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Expo project files
        run: |
          cat > package.json << 'EOF'
          {"name":"retire-app","version":"1.0.1","main":"node_modules/expo/AppEntry.js","scripts":{"start":"expo start"},"dependencies":{"expo":"~54.0.0","expo-status-bar":"~2.0.0","react":"18.3.1","react-native":"0.76.5","react-native-webview":"13.12.5"},"devDependencies":{"@babel/core":"^7.25.0","expo-build-properties":"~0.13.0"},"private":true}
          EOF

          cat > babel.config.js << 'EOF'
          module.exports = function(api) { api.cache(true); return { presets: ['babel-preset-expo'] }; };
          EOF

          cat > eas.json << 'EOF'
          {"cli":{"version":">= 14.0.0"},"build":{"preview":{"distribution":"internal","android":{"buildType":"apk"}}}}
          EOF

          cat > app.config.js << 'EOF'
          module.exports = {
            name: "은퇴투자 시뮬레이터 Pro",
            slug: "retire-app",
            version: "1.0.1",
            orientation: "portrait",
            userInterfaceStyle: "dark",
            owner: "kpopkop55",
            android: {
              package: "com.app.retirementsimulatorpro",
              versionCode: 2,
              adaptiveIcon: { backgroundColor: "#07091a" },
              permissions: ["INTERNET", "ACCESS_NETWORK_STATE"]
            },
            plugins: [["expo-build-properties", {"android": {"minSdkVersion": 24}}]]
          };
          EOF

          cat > App.js << 'EOF'
          import React, { useRef, useEffect } from 'react';
          import { StatusBar, View, BackHandler } from 'react-native';
          import { WebView } from 'react-native-webview';
          export default function App() {
            const ref = useRef(null);
            const canBack = useRef(false);
            useEffect(() => {
              const h = BackHandler.addEventListener('hardwareBackPress', () => {
                if (canBack.current && ref.current) { ref.current.goBack(); return true; }
                return false;
              });
              return () => h.remove();
            }, []);
            return (
              <View style={{ flex: 1, backgroundColor: '#07091a' }}>
                <StatusBar barStyle="light-content" backgroundColor="#07091a" />
                <WebView
                  ref={ref}
                  source={require('./assets/app.html')}
                  style={{ flex: 1, backgroundColor: '#07091a' }}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                  allowFileAccess={true}
                  allowUniversalAccessFromFileURLs={true}
                  mixedContentMode="always"
                  onNavigationStateChange={s => canBack.current = s.canGoBack}
                />
              </View>
            );
          }
          EOF

          mkdir -p assets
          echo "파일 생성 완료"
          ls -la

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
