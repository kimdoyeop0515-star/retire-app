name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Find and configure Android SDK
        run: |
          # SDK 경로 자동 탐색
          for p in /usr/local/lib/android/sdk $ANDROID_HOME $ANDROID_SDK_ROOT /home/runner/android; do
            if [ -d "$p/platforms" ]; then SDK="$p"; break; fi
          done
          echo "Found SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties
          
          # 라이선스 수락
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          
          # 설치된 컴포넌트 확인
          echo "=== Platforms ==="
          ls "$SDK/platforms/" 2>/dev/null || echo "없음"
          echo "=== Build-tools ==="
          ls "$SDK/build-tools/" 2>/dev/null || echo "없음"
          
          # android-33이 없으면 33 설치 시도
          if [ ! -d "$SDK/platforms/android-33" ] && [ -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2" 2>&1 | tail -3
          fi

      - name: Show project structure
        run: |
          echo "=== build.gradle.kts ===" && cat build.gradle.kts
          echo "=== settings.gradle.kts ===" && cat settings.gradle.kts  
          echo "=== app/build.gradle.kts ===" && cat app/build.gradle.kts
          echo "=== Files ===" && ls app/src/main/assets/ && ls app/src/main/java/com/retireplanner/app/

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -50
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      - name: Verify and show APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "✅ SUCCESS: $(du -sh $APK)"
          else
            echo "❌ APK not found"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 은퇴투자_시뮬레이터_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "은퇴투자 시뮬레이터 APK"
          body: "설치: app-debug.apk 다운로드 → 열기 → 설치"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
