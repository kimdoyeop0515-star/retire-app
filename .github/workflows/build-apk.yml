name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create all project files
        run: |
          mkdir -p app/src/main/java/com/retireplanner/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p gradle

          echo '' | base64 -d > app/src/main/AndroidManifest.xml

          echo '' | base64 -d > app/src/main/java/com/retireplanner/app/MainActivity.kt

          echo '' | base64 -d > app/src/main/assets/app.html

          echo 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPuydgO2HtO2IrOyekCDsi5zrrqzroIjsnbTthLA8L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > app/src/main/res/values/strings.xml

          echo '' | base64 -d > app/src/main/res/values/themes.xml

          echo '' | base64 -d > app/src/main/res/values/colors.xml

          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPGZ1bGwtYmFja3VwLWNvbnRlbnQ+CiAgICA8aW5jbHVkZSBkb21haW49InNoYXJlZHByZWYiIHBhdGg9Ii4iLz4KICAgIDxpbmNsdWRlIGRvbWFpbj0iZGF0YWJhc2UiIHBhdGg9Ii4iLz4KICAgIDxleGNsdWRlIGRvbWFpbj0icm9vdCIgcGF0aD0ibm9fYmFja3VwLyIvPgo8L2Z1bGwtYmFja3VwLWNvbnRlbnQ+Cg==' | base64 -d > app/src/main/res/xml/backup_rules.xml

          echo '' | base64 -d > app/src/main/res/xml/data_extraction_rules.xml

          echo '' | base64 -d > app/build.gradle.kts

          echo 'LWtlZXAgY2xhc3MgY29tLnJldGlyZXBsYW5uZXIuYXBwLioqIHsgKjsgfQota2VlcGNsYXNzbWVtYmVycyBjbGFzcyAqIHsKICAgIEBhbmRyb2lkLndlYmtpdC5KYXZhc2NyaXB0SW50ZXJmYWNlIDxtZXRob2RzPjsKfQo=' | base64 -d > app/proguard-rules.pro

          echo '' | base64 -d > gradle/libs.versions.toml

          python3 -c "import struct,zlib,os
def png(w,h):
    def c(t,d):
        r=struct.pack(">I",len(d))+t+d
        return r+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
    raw=b""
    for y in range(h):
        raw+=b"\x00"
        for x in range(w):
            nx,ny=x/w,y/h
            raw+=bytes([79,124,255] if ((nx-.5)**2+(ny-.5)**2)**.5<.4 else [7,9,26])
    return b"\x89PNG\r\n\x1a\n"+c(b"IHDR",struct.pack(">IIBBBBB",w,h,8,2,0,0,0))+c(b"IDAT",zlib.compress(raw))+c(b"IEND",b"")
for s,sz in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
    os.makedirs(f"app/src/main/res/mipmap-{s}",exist_ok=True)
    p=png(sz,sz)
    [open(f"app/src/main/res/mipmap-{s}/{n}","wb").write(p) for n in ["ic_launcher.png","ic_launcher_round.png"]]
print("icons ok")"

          echo "=== 파일 확인 ==="
          ls -la app/src/main/assets/
          echo "app.html: $(wc -c < app/src/main/assets/app.html) bytes"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Setup Android SDK
        run: |
          ANDROID_SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "Android SDK: $ANDROID_SDK"
          ls $ANDROID_SDK/build-tools/ || true
          ls $ANDROID_SDK/platforms/ || true
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1 | tail -5 || true

      - name: Create local.properties
        run: |
          ANDROID_SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "sdk.dir=$ANDROID_SDK" > local.properties
          cat local.properties

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Find and verify APK
        run: |
          echo "=== APK 파일 검색 ==="
          find . -name "*.apk" 2>/dev/null
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "SUCCESS! $(du -sh $APK)"
          else
            echo "FAILED - APK not found"
            exit 1
          fi

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 은퇴투자_시뮬레이터_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "은퇴투자 시뮬레이터"
          body: |
            ## 📲 설치 방법
            1. app-debug.apk 다운로드
            2. 폰에서 열기
            3. 설치 허용 후 설치
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
