name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup project files
        run: |
          mkdir -p app/src/main/java/com/retireplanner/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/{values,xml,mipmap-mdpi,mipmap-hdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}
          mkdir -p gradle/wrapper

          echo '' | base64 -d > app/src/main/AndroidManifest.xml

          echo '' | base64 -d > app/src/main/java/com/retireplanner/app/MainActivity.kt

          echo 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPuydgO2HtO2IrOyekCDsi5zrrqzroIjsnbTthLA8L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > app/src/main/res/values/strings.xml

          echo '' | base64 -d > app/src/main/res/values/themes.xml

          echo '' | base64 -d > app/src/main/res/values/colors.xml

          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPGZ1bGwtYmFja3VwLWNvbnRlbnQ+CiAgICA8aW5jbHVkZSBkb21haW49InNoYXJlZHByZWYiIHBhdGg9Ii4iLz4KICAgIDxpbmNsdWRlIGRvbWFpbj0iZGF0YWJhc2UiIHBhdGg9Ii4iLz4KICAgIDxleGNsdWRlIGRvbWFpbj0icm9vdCIgcGF0aD0ibm9fYmFja3VwLyIvPgo8L2Z1bGwtYmFja3VwLWNvbnRlbnQ+Cg==' | base64 -d > app/src/main/res/xml/backup_rules.xml

          echo '' | base64 -d > app/src/main/res/xml/data_extraction_rules.xml

          echo '' | base64 -d > app/build.gradle.kts

          echo 'LWtlZXAgY2xhc3MgY29tLnJldGlyZXBsYW5uZXIuYXBwLioqIHsgKjsgfQota2VlcGNsYXNzbWVtYmVycyBjbGFzcyAqIHsKICAgIEBhbmRyb2lkLndlYmtpdC5KYXZhc2NyaXB0SW50ZXJmYWNlIDxtZXRob2RzPjsKfQo=' | base64 -d > app/proguard-rules.pro

          echo '' | base64 -d > gradle/libs.versions.toml

          echo '' | base64 -d > gradle/wrapper/gradle-wrapper.properties

          python3 -c "
import struct,zlib
def png(w,h):
    def c(t,d):
        r=struct.pack('>I',len(d))+t+d
        return r+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
    raw=b''
    for y in range(h):
        raw+=b'\x00'
        for x in range(w):
            nx,ny=x/w,y/h
            if ((nx-.5)**2+(ny-.5)**2)**.5<.4: raw+=bytes([79,124,255])
            else: raw+=bytes([7,9,26])
    return b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b'')
import os
for s,sz in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
    p=png(sz,sz)
    for n in ['ic_launcher.png','ic_launcher_round.png']:
        open(f'app/src/main/res/mipmap-{s}/{n}','wb').write(p)
print('아이콘 생성 완료')
"
          curl -fsSL "https://raw.githubusercontent.com/nicowillis/gradle-wrapper-jar/main/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          wget -q "https://raw.githubusercontent.com/nicowillis/gradle-wrapper-jar/main/gradle-wrapper.jar" -O gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          curl -fsSL "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls app/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 은퇴투자_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: 은퇴투자 시뮬레이터
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
